version: "3.8"

services:
  streamlit-app:
    build: .
    container_name: nchu-weather-app
    ports:
      - "8501:8501"
    volumes:
      - ./data.db:/app/data.db
      - ./movie.csv:/app/movie.csv
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
